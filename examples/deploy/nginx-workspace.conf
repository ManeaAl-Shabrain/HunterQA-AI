# Template only. Protect the real configuration; never commit its edge key.
# Replace domain, certificate paths, backend port and the 64-hex key.
log_format hunterqa_without_args '$remote_addr $request_method $uri $status $request_time';
limit_req_zone $binary_remote_addr zone=hunterqa_requests:10m rate=5r/s;
server {
    listen 443 ssl;
    server_name alpha.example.test;
    ssl_certificate /etc/hunterqa/tls/alpha/fullchain.pem;
    ssl_certificate_key /etc/hunterqa/tls/alpha/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    access_log /var/log/hunterqa/alpha-access.log hunterqa_without_args;
    location / {
        limit_req zone=hunterqa_requests burst=20 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host alpha.example.test;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-HunterQA-Edge-Key REPLACE_WITH_PRIVATE_64_HEX_EDGE_KEY;
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
    }
}
