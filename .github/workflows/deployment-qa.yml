name: HunterQA Linux Deployment QA
on:
  pull_request:
    branches: [main, 'feature/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [native, compose]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare one owned deployment specification
        shell: bash
        run: |
          mkdir -m 700 "$RUNNER_TEMP/hunterqa-plan"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          spec = {"schema_version": 1, "workspace_id": "owned-ci", "home": "/srv/hunterqa-owned-ci",
            "runtime_prefix": "/opt/hunterqa-runtime", "user": "hunterqa-ci", "uid": 10001, "gid": 10001, "port": 8081}
          Path(os.environ["RUNNER_TEMP"], "hunterqa-spec.json").write_text(json.dumps(spec))
          PY
          python3 tools/render_deployment.py --config "$RUNNER_TEMP/hunterqa-spec.json" --out-dir "$RUNNER_TEMP/hunterqa-plan"
          sudo groupadd --gid 10001 hunterqa-ci
          sudo useradd --uid 10001 --gid 10001 --no-create-home --home-dir /nonexistent hunterqa-ci
          sudo install -d -m 700 -o 10001 -g 10001 /srv/hunterqa-owned-ci
          # Test-only network outage for the dedicated fixture UID. Builders and
          # the advisory auditor retain access; production units are unchanged.
          sudo iptables -I OUTPUT 1 -m owner --uid-owner 10001 ! -d 127.0.0.0/8 -j REJECT
          sudo ip6tables -I OUTPUT 1 -m owner --uid-owner 10001 ! -d ::1/128 -j REJECT
          sudo iptables -C OUTPUT -m owner --uid-owner 10001 ! -d 127.0.0.0/8 -j REJECT
          sudo ip6tables -C OUTPUT -m owner --uid-owner 10001 ! -d ::1/128 -j REJECT
      - name: Build shared runtime and execute owned lifecycle
        shell: bash
        env:
          HUNTERQA_OWNED_DEPLOYMENT_TEST: "1"
        run: |
          set -euo pipefail
          set -a
          . "$RUNNER_TEMP/hunterqa-plan/runtime.env"
          set +a
          export HUNTERQA_OPERATOR_ROOT="$HUNTERQA_HOME/control"
          export HUNTERQA_WORKSPACE_CONFIG="$HUNTERQA_OPERATOR_ROOT/owned-ci/workspace.json"
          export PLAYWRIGHT_BROWSERS_PATH="$HUNTERQA_RUNTIME_PREFIX/browsers"
          RUNTIME_HOME="$HUNTERQA_HOME/runtime-home"
          export SEMGREP_SEND_METRICS=off SEMGREP_ENABLE_VERSION_CHECK=0
          if [ '${{ matrix.mode }}' = native ]; then
            sudo sh tools/install_linux_runtime.sh --system-deps "$HUNTERQA_RUNTIME_PREFIX"
            owned() {
              sudo -u hunterqa-ci env HUNTERQA_OWNED_DEPLOYMENT_TEST=1 HUNTERQA_HOME="$HUNTERQA_HOME" HUNTERQA_PORT="$HUNTERQA_PORT" HUNTERQA_OPERATOR_ROOT="$HUNTERQA_OPERATOR_ROOT" HUNTERQA_WORKSPACE_CONFIG="$HUNTERQA_WORKSPACE_CONFIG" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" HOME="$RUNTIME_HOME" PATH="$HUNTERQA_RUNTIME_PREFIX/bin:$PATH" SEMGREP_SEND_METRICS=off SEMGREP_ENABLE_VERSION_CHECK=0 "$HUNTERQA_RUNTIME_PREFIX/bin/python" "$HUNTERQA_RUNTIME_PREFIX/share/hunterqa/verify_deployment.py" --phase "$1"
            }
            owned init | tee "$RUNNER_TEMP/hunterqa-runtime-inventory.json"
            sudo cp "$RUNNER_TEMP/hunterqa-plan/hunterqa-owned-ci.service" /etc/systemd/system/hunterqa-owned-ci.service
            sudo systemd-analyze verify /etc/systemd/system/hunterqa-owned-ci.service
            sudo systemctl daemon-reload
            sudo systemctl start hunterqa-owned-ci
            owned verify
            sudo systemctl stop hunterqa-owned-ci
            owned archive
            sudo systemctl start hunterqa-owned-ci
            owned restored
            sudo systemctl stop hunterqa-owned-ci
          else
            compose() {
              docker compose --env-file "$RUNNER_TEMP/hunterqa-plan/runtime.env" -f examples/deploy/compose.yaml -p hunterqa-owned-ci "$@"
            }
            compose config --quiet
            compose build --pull
            owned() {
              compose run --rm -T --no-deps -e HUNTERQA_OWNED_DEPLOYMENT_TEST --entrypoint "$HUNTERQA_RUNTIME_PREFIX/bin/python" app "$HUNTERQA_RUNTIME_PREFIX/share/hunterqa/verify_deployment.py" --phase "$1"
            }
            owned init | tee "$RUNNER_TEMP/hunterqa-runtime-inventory.json"
            compose up -d --wait --wait-timeout 90
            owned verify
            compose stop
            owned archive
            compose up -d --wait --wait-timeout 90
            owned restored
            compose down
          fi
      - name: Audit actual installed Python runtime packages
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          receipt = json.loads((root / "hunterqa-runtime-inventory.json").read_text())
          proof = receipt["semgrep_dependency_patch"]
          assert proof["vendor_payload_changed"] is False
          assert proof["upstream_version"] == "1.185.0" and proof["local_version"] == "1.185.0+hunterqa.1"
          packages = receipt["installed_python_packages"]
          assert packages["semgrep"] == proof["local_version"]
          rows = []
          for name, version in packages.items():
              if name.lower().replace('_','-') == 'hunterqa-ai':
                  continue
              # Only dependency metadata changed; audit unchanged vendor code
              # against its real published source release rather than skipping it.
              if name == 'semgrep':
                  version = proof['upstream_version']
              assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]*', name)
              assert re.fullmatch(r'[0-9][A-Za-z0-9_.+!]*', version)
              rows.append(name + '==' + version)
          (root / 'hunterqa-runtime-audit.txt').write_text('\n'.join(sorted(rows)) + '\n')
          print('Auditing', len(rows), 'installed packages; local application checked separately in Release QA')
          PY
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m venv "$RUNNER_TEMP/hunterqa-auditor"
          "$RUNNER_TEMP/hunterqa-auditor/bin/python" -m pip install pip-audit
          "$RUNNER_TEMP/hunterqa-auditor/bin/python" -m pip_audit --strict --no-deps --disable-pip --progress-spinner off -r "$RUNNER_TEMP/hunterqa-runtime-audit.txt"
      - name: Show bounded diagnostics on failure
        if: failure()
        shell: bash
        run: |
          sudo journalctl -u hunterqa-owned-ci --no-pager -n 80 || true
          docker compose --env-file "$RUNNER_TEMP/hunterqa-plan/runtime.env" -f examples/deploy/compose.yaml -p hunterqa-owned-ci logs --tail 80 || true
      - name: Stop owned services
        if: always()
        shell: bash
        run: |
          sudo systemctl stop hunterqa-owned-ci 2>/dev/null || true
          docker compose --env-file "$RUNNER_TEMP/hunterqa-plan/runtime.env" -f examples/deploy/compose.yaml -p hunterqa-owned-ci down || true
