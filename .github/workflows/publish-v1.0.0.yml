name: Publish HunterQA AI v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.0.0.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hunterqa-v1-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ManeaAl-Shabrain/HunterQA-AI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install and validate
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q hunterqa zeroscope
          python -m pytest -q

      - name: Package and verify release source
        shell: bash
        run: |
          python tools/build_release.py --repo . --out "$RUNNER_TEMP/HunterQA-AI-1.0.0-source.zip"
          python tools/verify_release_archive.py "$RUNNER_TEMP/HunterQA-AI-1.0.0-source.zip"
          (cd "$RUNNER_TEMP" && sha256sum HunterQA-AI-1.0.0-source.zip > HunterQA-AI-1.0.0-source.zip.sha256)

      - name: Create official immutable-version release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists; refusing to replace it."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0" >/dev/null 2>&1; then
            echo "Tag v1.0.0 already exists; review it before publishing."
            exit 1
          fi
          gh release create v1.0.0 \
            "$RUNNER_TEMP/HunterQA-AI-1.0.0-source.zip" \
            "$RUNNER_TEMP/HunterQA-AI-1.0.0-source.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "HunterQA AI 1.0.0 — Stable Local Research Release" \
            --notes-file RELEASE_NOTES.md \
            --latest
