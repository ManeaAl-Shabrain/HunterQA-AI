name: HunterQA AI Release QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out untrusted source without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install local project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Python syntax verification
        run: python -m compileall -q hunterqa zeroscope
      - name: Regression tests
        run: python -m pytest -q
      - name: Build and verify complete source package
        shell: bash
        run: |
          python tools/build_release.py --repo . --out "$RUNNER_TEMP/HunterQA-AI-1.0.0-source.zip"
          python tools/verify_release_archive.py "$RUNNER_TEMP/HunterQA-AI-1.0.0-source.zip"
