name: HunterQA AI Release QA
on:
  pull_request:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - name: Check out untrusted source without write credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install local project and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e '.[dev,quality,cloud,identity]'
      - name: Undefined names and unused imports
        run: python -m ruff check hunterqa zeroscope tools --select F
      - name: Review medium and high severity static security checks
        run: python -m bandit -r hunterqa zeroscope tools -ll
      - name: Audit installed third-party dependency advisories
        run: python -m pip_audit --skip-editable --progress-spinner off
      - name: Python syntax verification
        run: python -m compileall -q hunterqa zeroscope
      - name: Regression tests
        run: python -m pytest -q
      - name: HunterQA AI 1.1 offline bounty acceptance
        run: bash tools/verify_bounty_1_1.sh
      - name: HunterQA AI 1.2 offline agent and API acceptance
        run: bash tools/verify_agent_1_2.sh
      - name: HunterQA 1.3 offline workflow CLI acceptance
        run: python tools/verify_release_1_3.py
      - name: Install owned-lab Chromium test dependency
        run: |
          python -m pip install -e '.[browser]'
          python -m playwright install --with-deps chromium
      - name: Real Chromium authentication and cross-origin isolation on owned loopback
        env:
          HUNTERQA_REAL_BROWSER_CI: "1"
        run: python -m pytest -q tests/test_browser_lab_playwright_v12.py
      - name: Real Chromium approved-form checks with synthetic intercepted responses
        env:
          HUNTERQA_ENGAGEMENT_BROWSER_CI: "1"
        run: python -m pytest -q tests/test_engagement.py tests/test_scoped_rendered_discovery.py tests/test_runtime_validation.py tests/test_dashboard_browser.py tests/test_workflow_runner.py::test_workflow_dashboard_real_browser tests/test_web_discovery.py::test_discovery_dashboard_real_browser tests/test_assessment_adapters.py::test_access_dashboard_real_browser tests/test_assessment_readiness.py::test_owned_fixture_blocks_script_execution_in_real_chromium tests/test_operator_auth.py::test_operator_sign_in_read_only_view_and_sign_out_real_browser
      - name: Build and verify complete source package
        shell: bash
        run: |
          python tools/build_release.py --repo . --out "$RUNNER_TEMP/HunterQA-AI-1.3.0-qa-source.zip"
          python tools/verify_release_archive.py "$RUNNER_TEMP/HunterQA-AI-1.3.0-qa-source.zip"

  bundled-rule-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install the optional Semgrep engine for real rule validation
        run: python -m pip install semgrep -e .
      - name: Validate and exercise bundled rules on synthetic positive and negative fixtures
        run: python tools/verify_semgrep_rules.py

  source-action-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run local source action against an owned synthetic fixture
        id: source
        uses: ./
        with:
          authorized: 'true'
          project-path: examples/ci-source-fixture
          fail-on: none
      - name: Verify runner-local SARIF without uploading it
        env:
          HUNTERQA_TEST_SARIF: ${{ steps.source.outputs.sarif-path }}
          HUNTERQA_TEST_COUNT: ${{ steps.source.outputs.candidate-count }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ["HUNTERQA_TEST_SARIF"]).read_text())
          if data["version"] != "2.1.0" or int(os.environ["HUNTERQA_TEST_COUNT"]) < 1:
              raise ValueError("Source action did not preserve synthetic review candidates")
          if any(row["properties"]["verificationStatus"] != "unverified" for row in data["runs"][0]["results"]):
              raise ValueError("Source action overclaimed validation")
          print("PASS: source-only action produced private SARIF candidates without uploading")
          PY
