[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hunterqa-ai"
version = "1.1.0"
description = "HunterQA AI: authorized local and bounded bug bounty security research"
requires-python = ">=3.11"
dependencies = ["Flask>=3.0,<4", "packaging>=23,<27"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
hunterqa = "hunterqa.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["hunterqa*", "zeroscope*"]

[tool.setuptools.package-data]
hunterqa = ["templates/*.html", "static/*", "rules/*.yml"]
