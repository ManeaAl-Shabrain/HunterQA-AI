[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hunterqa-ai"
version = "1.3.0"
description = "HunterQA: supervised authorized assessment workflows, local research and evidence review"
requires-python = ">=3.11"
dependencies = ["Flask>=3.0,<4", "packaging>=23,<27", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
browser = ["playwright>=1.48,<2"]
cloud = ["botocore>=1.35,<2"]
identity = ["PyJWT[crypto]>=2.15.1,<3", "cryptography>=50.0.2,<51"]
network = ["dnspython>=2.9.1,<3"]
quality = ["ruff>=0.14,<1", "bandit>=1.9,<2", "pip-audit>=2.10,<3"]

[project.scripts]
hunterqa = "hunterqa.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["hunterqa*", "zeroscope*"]

[tool.setuptools.package-data]
hunterqa = ["templates/*.html", "static/*", "rules/*.yml", "fixtures/*.json"]
